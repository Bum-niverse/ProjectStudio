[package]
name = "projectstudio"
version = "0.4.0"
description = "Local-first product planning and development tracker"
authors = ["Bum-niverse"]
license = ""
repository = "https://github.com/Bum-niverse/ProjectStudio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "projectstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
